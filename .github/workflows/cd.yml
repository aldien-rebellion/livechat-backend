name: Backend CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Backend Image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/livechat-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/livechat-backend:${{ github.sha }}

  deploy-to-server:
    name: Deploy to Cloud Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: SSH to Server and Update Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/livechat-server
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/livechat-backend:latest
            docker compose up -d --remove-orphans backend
            docker compose exec -T backend alembic upgrade head
            docker compose exec -T backend python -m scripts.set_admin poorin.o@ku.th --grant
            docker compose exec -T backend python -m scripts.set_admin aldienre@gmail.com --grant
